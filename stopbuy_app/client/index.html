<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>StopBuy — 구매 후회 예측 AI</title>
    <meta name="description" content="AI가 구매 전에 후회 가능성을 예측하고 더 나은 대체상품을 추천합니다." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Analytics: Manus 환경에서만 활성화됨 -->
    <script>
      (function() {
        var ep = '%VITE_ANALYTICS_ENDPOINT%';
        var id = '%VITE_ANALYTICS_WEBSITE_ID%';
        if (ep && ep.indexOf('%') === -1 && id && id.indexOf('%') === -1) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = ep + '/umami';
          s.setAttribute('data-website-id', id);
          document.head.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
